spring.application.name=Aries

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/smart_reviewer

# GNews API
gnews.api.key=${GNEWS_API_KEY}
gnews.api.url=https://gnews.io/api/v4

# Firecrawl — full article content scraping
firecrawl.api.key=${FIRECRAWL_API_KEY}
firecrawl.api.url=https://api.firecrawl.dev

# Anthropic — set ANTHROPIC_API_KEY environment variable (read by the SDK automatically)
anthropic.model=claude-opus-4-8

# Server
server.port=8080
